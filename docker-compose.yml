services:
  backend:
    build:
      context: ./backend
    image: habla-bien-backend:latest
    container_name: habla-bien-backend
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-whisper-1}
      OPENAI_ANALYSIS_MODEL: ${OPENAI_ANALYSIS_MODEL:-gpt-4o}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-10}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    networks:
      - hablabien-net

  web:
    build:
      context: ./mobile
      args:
        # URL pública del backend; se inyecta en el bundle de la app web.
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL}
    image: habla-bien-web:latest
    container_name: habla-bien-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - hablabien-net

networks:
  hablabien-net:
    driver: bridge
